[workspace]
members = [".", "migration", "shared_constants", "pg_fts"]

[package]
name = "caliborn"
description = "API server for lumiRadio"
version = "0.1.0"
authors = ["cozyGalvinism <jean@der-capta.in>"]
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = "0.4"
figment = { version = "0.10", features = ["env"] }
hmac = "0.12"
jwt = "0.16"
oauth2 = "5.0.0"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls"
] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
serenity = "0.12.5"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
axum-macros = "0.5.1"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-rust_decimal",
] }
migration = { path = "./migration" }
async-trait = "0.1.92"
rand = "0.10"
prefixed-api-key = { version = "0.3.0", features = ["all"] }
tracing = "0.1.44"
hex = "0.4.3"
subtle = "2.6.1"
anyhow = { version = "1.0.104", features = ["backtrace"] }
tracing-unwrap = "1.0.1"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tower = "0.5.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
shared_constants = { path = "./shared_constants" }
pg_fts = { path = "./pg_fts" }
paste = "1.0.15"
clap = { version = "4.6", features = ["derive"] }
aes-gcm = "0.10.3"
walkdir = "2.5"
notify = "6.1"
lofty = "0.24"
m3u = "1.0"
futures-util = "0.3"

[dev-dependencies]
mockall = "0.13.1"
rstest = "0.25.0"
sea-orm = { version = "2.0", features = ["mock"] }
testcontainers = "0.24.0"
testcontainers-modules = { version = "0.12.1", features = ["postgres"] }
